# security updates are enabled in repo settings, not here
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /e2e
    schedule:
      interval: weekly
    # skip brand-new releases
    cooldown:
      default-days: 3
    # fix(deps) triggers a patch release; chore(deps-dev) doesn't
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # majors stay separate and aren't automerged
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # skip brand-new releases
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
