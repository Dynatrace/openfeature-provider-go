linters:
  enable:
    - copyloopvar
    - errcheck
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - nolintlint
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  gosec:
    excludes:
      - G404  # math/rand used intentionally for jitter (not crypto)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
