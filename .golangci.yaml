version: "2"

linters:
  enable:
    - copyloopvar
    - errcheck
    - gosec
    - govet
    - ineffassign
    - intrange
    - misspell
    - nolintlint
    - staticcheck
    - unused

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G404  # math/rand used intentionally for jitter (not crypto)

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
